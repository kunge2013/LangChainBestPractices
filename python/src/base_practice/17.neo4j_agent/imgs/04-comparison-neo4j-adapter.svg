<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="30" y="28" fill="white" font-size="16" font-weight="700">Before / After: Neo4j 连接统一</text>
  <text x="30" y="44" fill="#94a3b8" font-size="9">双路径连接 → 统一 Adapter 管理</text>

  <!-- Divider line -->
  <line x1="450" y1="55" x2="450" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- BEFORE: LEFT HALF -->
  <rect x="30" y="70" width="390" height="370" rx="12" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
  <rect x="42" y="78" width="180" height="22" rx="4" fill="rgba(136,19,55,0.6)" stroke="#ef4444" stroke-width="1"/>
  <text x="132" y="94" fill="#ef4444" font-size="10" font-weight="700" text-anchor="middle">BEFORE · 双路径连接</text>

  <!-- Config at top -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="120" height="42" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="120" height="42" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="60" y="18" fill="white" font-size="11" font-weight="600" text-anchor="middle">Config</text>
    <text x="60" y="34" fill="#fbbf24" font-size="8" text-anchor="middle">配置管理</text>
  </g>

  <!-- Path A (left): VectorStoreBuilder → Neo4jVector -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="130" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="65" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">VectorStoreBuilder</text>
    <text x="65" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">Neo4jVector 封装</text>
  </g>

  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="45" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="65" y="20" fill="white" font-size="10" font-weight="600" text-anchor="middle">Neo4jVector</text>
    <text x="65" y="36" fill="#60a5fa" font-size="8" text-anchor="middle">LangChain 封装</text>
  </g>

  <!-- Arrow: Config → Path A -->
  <line x1="170" y1="162" x2="115" y2="185" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-emerald)"/>

  <!-- Arrow: VectorStoreBuilder → Neo4jVector -->
  <line x1="115" y1="245" x2="115" y2="255" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- Path B (right): GetSectionImages → Raw driver -->
  <g transform="translate(230, 185)">
    <rect x="0" y="0" width="130" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="50" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="65" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">GetSectionImages</text>
    <text x="65" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">章节检索</text>
  </g>

  <g transform="translate(230, 260)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="45" rx="6" fill="rgba(136,19,55,0.4)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="65" y="16" fill="#ef4444" font-size="9" font-weight="600" text-anchor="middle">GraphDatabase</text>
    <text x="65" y="30" fill="#ef4444" font-size="9" font-weight="600" text-anchor="middle">.driver()</text>
    <text x="65" y="41" fill="#94a3b8" font-size="7" text-anchor="middle">原生驱动 (绕过封装)</text>
  </g>

  <!-- Arrow: Config → Path B -->
  <line x1="230" y1="162" x2="295" y2="185" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow-emerald)"/>

  <!-- Arrow: GetSectionImages → Raw driver -->
  <line x1="295" y1="245" x2="295" y2="255" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <!-- Both paths converge on same Neo4j -->
  <g transform="translate(140, 340)">
    <rect x="0" y="10" width="140" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="#0f172a"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="140" y1="10" x2="140" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">Neo4j 数据库</text>
  </g>

  <!-- Arrows to Neo4j -->
  <line x1="115" y1="315" x2="160" y2="340" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="295" y1="315" x2="190" y2="340" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- Warning callout -->
  <g transform="translate(40, 18)">
    <rect x="0" y="0" width="200" height="85" rx="6" fill="rgba(136,19,55,0.15)" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="100" y="16" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle">⚠ 问题分析</text>
    <text x="10" y="32" fill="#94a3b8" font-size="8">• 两条独立的 Neo4j 连接路径</text>
    <text x="10" y="46" fill="#94a3b8" font-size="8">• 连接池无法统一管理</text>
    <text x="10" y="60" fill="#94a3b8" font-size="8">• 配置变更需修改两处</text>
    <text x="10" y="74" fill="#94a3b8" font-size="8">• 绕过 LangChain 封装层</text>
  </g>

  <!-- AFTER: RIGHT HALF -->
  <rect x="480" y="70" width="390" height="370" rx="12" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
  <rect x="492" y="78" width="190" height="22" rx="4" fill="rgba(6,78,59,0.4)" stroke="#059669" stroke-width="1"/>
  <text x="587" y="94" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">AFTER · 统一 Adapter</text>

  <!-- Config at top -->
  <g transform="translate(590, 110)">
    <rect x="0" y="0" width="120" height="42" rx="8" fill="#0f172a"/>
    <rect x="0" y="0" width="120" height="42" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="60" y="18" fill="white" font-size="11" font-weight="600" text-anchor="middle">Config</text>
    <text x="60" y="34" fill="#fbbf24" font-size="8" text-anchor="middle">配置管理</text>
  </g>

  <!-- Single Neo4jAdapter -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="210" height="60" rx="10" fill="#0f172a"/>
    <rect x="0" y="0" width="210" height="60" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
    <!-- connector icon -->
    <circle cx="25" cy="30" r="10" fill="none" stroke="#34d399" stroke-width="1.2"/>
    <path d="M 20 30 L 30 30 M 25 25 L 25 35" stroke="#34d399" stroke-width="1.2"/>
    <text x="115" y="24" fill="white" font-size="12" font-weight="700" text-anchor="middle">Neo4jAdapter</text>
    <text x="115" y="42" fill="#34d399" font-size="9" text-anchor="middle">统一连接管理 · 连接池复用</text>
  </g>

  <!-- Arrow: Config → Adapter -->
  <line x1="650" y1="162" x2="650" y2="175" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Both tools use the adapter -->
  <g transform="translate(500, 270)">
    <rect x="0" y="0" width="140" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="140" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">VectorStoreBuilder</text>
    <text x="70" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">通过 Adapter 连接</text>
  </g>

  <g transform="translate(680, 270)">
    <rect x="0" y="0" width="140" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="140" height="50" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="70" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">GetSectionImages</text>
    <text x="70" y="38" fill="#94a3b8" font-size="8" text-anchor="middle">通过 Adapter 连接</text>
  </g>

  <!-- Arrows: Adapter → Tools -->
  <line x1="600" y1="250" x2="570" y2="265" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="700" y1="250" x2="750" y2="265" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Neo4j at bottom -->
  <g transform="translate(590, 350)">
    <rect x="0" y="10" width="140" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="#0f172a"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="70" cy="10" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="70" cy="60" rx="70" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="140" y1="10" x2="140" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">Neo4j 数据库</text>
  </g>

  <!-- Arrow: Tools → Neo4j (via Adapter concept) -->
  <line x1="570" y1="330" x2="610" y2="350" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="750" y1="330" x2="710" y2="350" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- Success callout -->
  <g transform="translate(500, 118)">
    <rect x="0" y="0" width="200" height="52" rx="6" fill="rgba(6,78,59,0.15)" stroke="#34d399" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="100" y="16" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">✅ 统一连接管理</text>
    <text x="10" y="32" fill="#94a3b8" font-size="8">• 单一连接，连接池复用</text>
    <text x="10" y="46" fill="#94a3b8" font-size="8">• 配置变更只需一处</text>
  </g>

  <!-- Center arrow: BEFORE → AFTER -->
  <g transform="translate(430, 230)">
    <polygon points="0,15 25,0 25,10 40,10 40,20 25,20 25,30" fill="#34d399"/>
    <text x="20" y="48" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">统一</text>
    <text x="20" y="60" fill="#94a3b8" font-size="7" text-anchor="middle">Adapter</text>
  </g>
</svg>
