<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="30" y="28" fill="white" font-size="16" font-weight="700">模块依赖图</text>
  <text x="30" y="44" fill="#94a3b8" font-size="9">Config 为中心枢纽的模块依赖关系</text>

  <!-- Config (center hub at top) -->
  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="160" height="55" rx="10" fill="#0f172a"/>
    <rect x="0" y="0" width="160" height="55" rx="10" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="22" fill="white" font-size="13" font-weight="700" text-anchor="middle">Config</text>
    <text x="80" y="40" fill="#fbbf24" font-size="9" text-anchor="middle">配置管理 · 全局中心</text>
  </g>

  <!-- Config → All modules (dashed dependency arrows) -->
  <!-- To Data Layer -->
  <line x1="360" y1="135" x2="120" y2="195" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <line x1="400" y1="135" x2="330" y2="195" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <line x1="440" y1="135" x2="540" y2="195" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <!-- To Tools Layer -->
  <line x1="370" y1="135" x2="200" y2="290" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <line x1="430" y1="135" x2="480" y2="290" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <!-- To Agent -->
  <line x1="400" y1="135" x2="400" y2="375" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <!-- To Pipeline/API -->
  <line x1="360" y1="135" x2="280" y2="440" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>
  <line x1="440" y1="135" x2="480" y2="440" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" opacity="0.5"/>

  <!-- DATA LAYER -->
  <!-- Layer label -->
  <text x="30" y="210" fill="#64748b" font-size="8" font-weight="600">数据层</text>

  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="140" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="70" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">DocxParser</text>
    <text x="70" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">文档解析</text>
  </g>

  <g transform="translate(280, 195)">
    <rect x="0" y="0" width="140" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="140" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="70" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">ImageDescriber</text>
    <text x="70" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">图片描述</text>
  </g>

  <g transform="translate(500, 195)">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="75" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">VectorStoreBuilder</text>
    <text x="75" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">向量库构建</text>
  </g>

  <!-- TOOLS LAYER -->
  <text x="30" y="305" fill="#64748b" font-size="8" font-weight="600">工具层</text>

  <g transform="translate(130, 290)">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="50" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="75" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">KnowledgeSearcher</text>
    <text x="75" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">知识检索工具</text>
  </g>

  <g transform="translate(430, 290)">
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="50" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="75" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">GetSectionImages</text>
    <text x="75" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">章节图片检索</text>
  </g>

  <!-- AGENT LAYER -->
  <text x="30" y="390" fill="#64748b" font-size="8" font-weight="600">Agent层</text>

  <g transform="translate(310, 375)">
    <rect x="0" y="0" width="170" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="170" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="85" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">BillingAgent</text>
    <text x="85" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Deep Agent 创建</text>
  </g>

  <!-- Inter-layer arrows: Data → Pipeline -->
  <line x1="130" y1="255" x2="310" y2="440" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="350" y1="255" x2="370" y2="440" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="575" y1="255" x2="480" y2="440" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Inter-layer: Tools → Agent -->
  <line x1="205" y1="350" x2="310" y2="395" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="505" y1="350" x2="480" y2="395" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Inter-layer: Agent → Pipeline + API -->
  <line x1="370" y1="435" x2="310" y2="455" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <line x1="420" y1="435" x2="480" y2="455" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- ORCHESTRATION LAYER -->
  <text x="30" y="470" fill="#64748b" font-size="8" font-weight="600">编排层</text>

  <g transform="translate(230, 440)">
    <rect x="0" y="0" width="130" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="50" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="65" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">BillingManualPipeline</text>
    <text x="65" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">主流程编排</text>
  </g>

  <g transform="translate(440, 440)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="120" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="22" fill="white" font-size="10" font-weight="600" text-anchor="middle">build_agent()</text>
    <text x="60" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">API 入口</text>
  </g>

  <!-- Legend -->
  <g transform="translate(600, 440)">
    <text x="0" y="0" fill="#64748b" font-size="8">图例</text>
    <line x1="0" y1="10" x2="25" y2="10" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
    <text x="30" y="13" fill="#94a3b8" font-size="7">Config 依赖 (全局)</text>
    <line x1="0" y1="22" x2="25" y2="22" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
    <text x="30" y="25" fill="#94a3b8" font-size="7">数据流</text>
    <line x1="0" y1="34" x2="25" y2="34" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
    <text x="30" y="37" fill="#94a3b8" font-size="7">编排流</text>
  </g>
</svg>
