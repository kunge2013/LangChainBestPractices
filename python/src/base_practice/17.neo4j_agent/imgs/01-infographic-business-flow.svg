<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="30" y="28" fill="white" font-size="16" font-weight="700">系统业务流程</text>
  <text x="30" y="44" fill="#94a3b8" font-size="9">docx → Neo4j → Agent 问答 完整数据流水线</text>

  <!-- Stage 1: Document -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="80" height="100" rx="6" fill="url(#docGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- document lines -->
    <line x1="15" y1="25" x2="65" y2="25" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="15" y1="38" x2="65" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="15" y1="51" x2="50" y2="51" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="15" y1="64" x2="65" y2="64" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="40" y="88" fill="white" font-size="9" font-weight="500" text-anchor="middle">操作手册.docx</text>
  </g>

  <!-- Arrow: docx → Parser -->
  <line x1="150" y1="170" x2="180" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 2: DocxParser -->
  <g transform="translate(190, 140)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="65" y="24" fill="white" font-size="11" font-weight="600" text-anchor="middle">DocxParser</text>
    <text x="65" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">解析文本段落 + 提取图片</text>
  </g>

  <!-- Arrow: Parser → Describer -->
  <line x1="330" y1="170" x2="360" y2="170" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Stage 3: ImageDescriber -->
  <g transform="translate(370, 140)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <!-- brain icon -->
    <circle cx="25" cy="30" r="8" fill="none" stroke="#34d399" stroke-width="1.2"/>
    <text x="25" y="34" fill="#34d399" font-size="10" text-anchor="middle">AI</text>
    <text x="80" y="24" fill="white" font-size="11" font-weight="600" text-anchor="middle">ImageDescriber</text>
    <text x="80" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">qwen VL 生成图片描述</text>
  </g>

  <!-- Arrow: Describer → Splitter -->
  <line x1="510" y1="170" x2="540" y2="170" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 4: TextSplitter -->
  <g transform="translate(550, 140)">
    <rect x="0" y="0" width="120" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="120" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="60" y="24" fill="white" font-size="11" font-weight="600" text-anchor="middle">TextSplitter</text>
    <text x="60" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">文本分块 · chunk</text>
  </g>

  <!-- Arrow: Splitter → Embeddings -->
  <line x1="680" y1="170" x2="710" y2="170" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Stage 5: Embeddings -->
  <g transform="translate(720, 140)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="65" y="24" fill="white" font-size="10" font-weight="600" text-anchor="middle">HuggingFace</text>
    <text x="65" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">Embeddings 向量化</text>
  </g>

  <!-- Arrow: Embeddings → Neo4j (downward) -->
  <line x1="785" y1="210" x2="785" y2="260" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- Stage 6: Neo4j Vector Store -->
  <g transform="translate(720, 270)">
    <rect x="0" y="10" width="130" height="50" rx="2" fill="#0f172a"/>
    <ellipse cx="65" cy="10" rx="65" ry="12" fill="#0f172a"/>
    <ellipse cx="65" cy="60" rx="65" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="130" height="50" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="65" cy="10" rx="65" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="65" cy="60" rx="65" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="130" y1="10" x2="130" y2="60" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="65" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle">Neo4j 向量库</text>
  </g>

  <!-- Arrow: Neo4j → Agent (leftward) -->
  <line x1="710" y1="295" x2="600" y2="295" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="655" y="285" fill="#fb7185" font-size="8">创建</text>

  <!-- Stage 7: BillingAgent -->
  <g transform="translate(430, 265)">
    <rect x="0" y="0" width="150" height="60" rx="6" fill="#0f172a"/>
    <rect x="0" y="0" width="150" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <!-- robot icon -->
    <rect x="8" y="18" width="20" height="20" rx="3" fill="none" stroke="#fb7185" stroke-width="1.2"/>
    <circle cx="14" cy="25" r="2" fill="#fb7185"/>
    <circle cx="22" cy="25" r="2" fill="#fb7185"/>
    <text x="88" y="24" fill="white" font-size="11" font-weight="600" text-anchor="middle">BillingAgent</text>
    <text x="88" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">Deep Agent 创建</text>
  </g>

  <!-- Tools under Agent -->
  <!-- Arrow: Agent → Tools -->
  <line x1="505" y1="335" x2="505" y2="365" stroke="#fb7185" stroke-width="1" marker-end="url(#arrow-rose)"/>

  <!-- Tool 1: KnowledgeSearcher -->
  <g transform="translate(370, 370)">
    <rect x="0" y="0" width="130" height="35" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="35" rx="4" fill="rgba(136,19,55,0.2)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="65" y="22" fill="#fb7185" font-size="9" font-weight="500" text-anchor="middle">KnowledgeSearcher</text>
  </g>

  <!-- Tool 2: GetSectionImages -->
  <g transform="translate(520, 370)">
    <rect x="0" y="0" width="130" height="35" rx="4" fill="#0f172a"/>
    <rect x="0" y="0" width="130" height="35" rx="4" fill="rgba(136,19,55,0.2)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="65" y="22" fill="#fb7185" font-size="9" font-weight="500" text-anchor="middle">GetSectionImages</text>
  </g>

  <!-- Arrow: Agent → 用户问答 (leftward) -->
  <line x1="420" y1="295" x2="300" y2="295" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="360" y="285" fill="#34d399" font-size="8">问答</text>

  <!-- Stage 8: 用户问答 -->
  <g transform="translate(170, 265)">
    <rect x="0" y="0" width="110" height="60" rx="20" fill="#0f172a"/>
    <rect x="0" y="0" width="110" height="60" rx="20" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <!-- speech bubble -->
    <text x="55" y="34" fill="white" font-size="14" font-weight="700" text-anchor="middle">用户问答</text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 370)">
    <text x="0" y="0" fill="#64748b" font-size="8">图例</text>
    <line x1="0" y1="8" x2="20" y2="8" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <text x="25" y="11" fill="#94a3b8" font-size="7">解析</text>
    <line x1="0" y1="18" x2="20" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <text x="25" y="21" fill="#94a3b8" font-size="7">处理</text>
    <line x1="50" y1="8" x2="70" y2="8" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
    <text x="75" y="11" fill="#94a3b8" font-size="7">存储</text>
    <line x1="50" y1="18" x2="70" y2="18" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
    <text x="75" y="21" fill="#94a3b8" font-size="7">Agent</text>
  </g>
</svg>
